<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep JetBrainsMono Nerd Font primary; use Noto only for missing glyphs. -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Render Noto's bitmap emoji slightly larger and synthetically bolder. -->
  <match target="font">
    <test name="family" compare="eq">
      <string>Noto Color Emoji</string>
    </test>

    <!-- Normalize the bitmap strike to the requested size, then enlarge it by 8%. -->
    <edit name="pixelsizefixupfactor" mode="assign">
      <times>
        <divide>
          <name target="pattern">pixelsize</name>
          <name target="font">pixelsize</name>
        </divide>
        <double>1.08</double>
      </times>
    </edit>
    <edit name="matrix" mode="assign">
      <times>
        <name>matrix</name>
        <matrix>
          <name>pixelsizefixupfactor</name>
          <double>0</double>
          <double>0</double>
          <name>pixelsizefixupfactor</name>
        </matrix>
      </times>
    </edit>
    <edit name="size" mode="assign">
      <divide>
        <name>size</name>
        <name>pixelsizefixupfactor</name>
      </divide>
    </edit>
    <edit name="embolden" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
