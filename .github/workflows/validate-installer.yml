name: Validate common dotfiles manager

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y shellcheck zsh
          else
            brew install shellcheck
          fi

      - name: Check shell syntax
        run: |
          bash -n bin/dots
          bash -n tests/test-dots.sh
          bash -n scripts/migrate-terminal-repo.sh
          zsh -n dots/zshenv
          zsh -n config/terminal/zsh/.zshrc
          zsh -n config/terminal/zsh/prompt.zsh
          zsh -n themes/adapters/fzf.zsh

      - name: ShellCheck
        run: shellcheck --severity=warning bin/dots tests/test-dots.sh scripts/migrate-terminal-repo.sh

      - name: Validate common profile
        shell: bash
        run: |
          test -s manifest/configs.tsv
          test -s manifest/packages.tsv
          test -s nix/packages.nix
          test ! -e nix/niri.nix
          test ! -d nix/hosts/starforge
          test ! -d config/ui
          test ! -e install.sh
          grep -Fq 'builtins.readFile ../manifest/packages.tsv' nix/packages.nix
          awk -F '\t' '$1 == "nixpkgs" && $2 == "zsh" && $3 == "required" { found=1 } END { exit !found }' manifest/packages.tsv
          test -d config/terminal
          test ! -d legacy/ui
          for component in niri waybar mako rofi; do
            if awk -F '\t' -v component="$component" '$1 == component { found=1 } END { exit !found }' manifest/configs.tsv; then
              echo "Desktop component unexpectedly included in common manifest: $component"
              exit 1
            fi
          done
          while IFS=$'\t' read -r component kind source target platforms; do
            [[ -z "$component" || "$component" == \#* ]] && continue
            [[ "$kind" == file || "$kind" == tree ]]
            [[ -e "$source" || -L "$source" ]]
          done < manifest/configs.tsv
          if grep -n -E -- '--desktop|config/ui|(^|[^[:alnum:]_-])(niri|waybar|mako|rofi)([^[:alnum:]_-]|$)' bin/dots; then
            echo 'Desktop-specific references found in the common installer.'
            exit 1
          fi

      - name: Help and non-destructive dry run
        run: |
          ./bin/dots --help
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" XDG_DATA_HOME="$test_home/.local/share" DOTS_SKIP_DOWNLOADS=1 ./bin/dots install --dry-run --no-packages --yes
          test ! -e "$test_home/.zshenv"
          test ! -e "$test_home/.config"

      - name: End-to-end lifecycle tests
        run: bash tests/test-dots.sh
