name: Validate common dotfiles manager

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y shellcheck zsh
          else
            brew install shellcheck
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Validate Rust suggestion helper
        run: |
          cargo fmt --manifest-path rust/dots-suggest/Cargo.toml -- --check
          cargo clippy --manifest-path rust/dots-suggest/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/dots-suggest/Cargo.toml
          cargo build --manifest-path rust/dots-suggest/Cargo.toml

      - name: Check shell syntax
        run: |
          bash -n bin/dots
          bash -n tests/test-dots.sh
          bash -n scripts/migrate-terminal-repo.sh
          zsh -n dots/zshenv
          for script in \
            config/terminal/zsh/.zshrc \
            config/terminal/zsh/command-state.zsh \
            config/terminal/zsh/command-suggestions.zsh \
            config/terminal/zsh/diagnostics.zsh \
            config/terminal/zsh/failure-classifier.zsh \
            config/terminal/zsh/failure-messages.zsh \
            config/terminal/zsh/failure-animation.zsh \
            config/terminal/zsh/handlers.zsh \
            config/terminal/zsh/prompt.zsh \
            themes/adapters/fzf.zsh \
            tests/test-command-state.zsh \
            tests/test-command-suggestions.zsh \
            tests/test-diagnostics.zsh \
            tests/test-failure-classifier.zsh \
            tests/test-failure-messages.zsh \
            tests/test-failure-integration.zsh \
            tests/test-failure-animation.zsh; do
            zsh -n "$script"
          done

      - name: Check terminal-model helper syntax
        run: python3 -m py_compile tests/helpers/vt_screen.py

      - name: Zsh module tests
        run: |
          export PATH="$PWD/rust/dots-suggest/target/debug:$PATH"
          for test in \
            tests/test-command-state.zsh \
            tests/test-command-suggestions.zsh \
            tests/test-diagnostics.zsh \
            tests/test-failure-classifier.zsh \
            tests/test-failure-messages.zsh \
            tests/test-failure-integration.zsh \
            tests/test-failure-animation.zsh; do
            zsh "$test"
          done

      - name: ShellCheck
        run: shellcheck --severity=warning bin/dots tests/test-dots.sh scripts/migrate-terminal-repo.sh

      - name: Validate common profile
        shell: bash
        run: |
          test -x bin/dots
          test -s manifest/configs.tsv
          test -s manifest/packages.tsv
          test -s nix/packages.nix
          test ! -e nix/niri.nix
          test ! -d nix/hosts/starforge
          test ! -d config/ui
          test ! -e install.sh
          grep -Fq 'builtins.readFile ../manifest/packages.tsv' nix/packages.nix
          awk -F '\t' '$1 == "nixpkgs" && $2 == "zsh" && $3 == "required" { found=1 } END { exit !found }' manifest/packages.tsv
          test -d config/terminal
          test ! -d legacy/ui
          for component in niri waybar mako rofi; do
            if awk -F '\t' -v component="$component" '$1 == component { found=1 } END { exit !found }' manifest/configs.tsv; then
              echo "Desktop component unexpectedly included in common manifest: $component"
              exit 1
            fi
          done
          while IFS=$'\t' read -r component kind source target platforms; do
            [[ -z "$component" || "$component" == \#* ]] && continue
            [[ "$kind" == file || "$kind" == tree ]]
            [[ -e "$source" || -L "$source" ]]
          done < manifest/configs.tsv
          if grep -n -E -- '--desktop|config/ui|(^|[^[:alnum:]_-])(niri|waybar|mako|rofi)([^[:alnum:]_-]|$)' bin/dots; then
            echo 'Desktop-specific references found in the common installer.'
            exit 1
          fi

      - name: Validate Yazi TOML and theme defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          import xml.etree.ElementTree as ET

          config = Path("config/terminal/yazi")
          settings = tomllib.loads((config / "yazi.toml").read_text())
          theme = tomllib.loads((config / "theme.toml").read_text())

          assert settings["opener"]["edit"][0]["run"] == "nvim %s"
          assert settings["opener"]["edit"][0]["block"] is True
          assert theme["mgr"]["syntect_theme"] == "~/.config/yazi/Catppuccin-frappe.tmTheme"
          assert theme["mode"]["normal_main"]["bg"] == "#85c1dc"
          assert (config / "Catppuccin-frappe.tmTheme").is_file()
          alacritty = Path("config/terminal/alacritty")
          terminal = tomllib.loads((alacritty / "alacritty.toml").read_text())
          frappe = tomllib.loads((alacritty / "catppuccin-frappe.toml").read_text())

          assert terminal["general"]["import"] == ["catppuccin-frappe.toml"]
          assert terminal["font"]["normal"]["family"] == "JetBrainsMono Nerd Font"
          assert terminal["font"]["bold"]["family"] == "JetBrainsMono Nerd Font"
          assert terminal["font"]["italic"]["family"] == "JetBrainsMono Nerd Font"
          assert terminal["font"]["bold_italic"]["family"] == "JetBrainsMono Nerd Font"
          assert terminal["scrolling"]["history"] == 20000
          assert terminal["cursor"]["style"]["shape"] == "Beam"
          assert terminal["cursor"]["blink_interval"] == 1000
          assert terminal["window"]["opacity"] == 0.9
          assert terminal["window"]["decorations"] == "None"
          assert terminal["window"]["blur"] is True
          assert terminal["general"]["ipc_socket"] is False
          assert terminal["hints"]["enabled"][0]["hyperlinks"] is True
          assert terminal["hints"]["enabled"][0]["action"] == "Copy"
          bindings = terminal["keyboard"]["bindings"]
          assert {"key": "T", "mods": "Alt", "action": "CreateNewTab"} in bindings
          assert {"key": "]", "mods": "Alt", "action": "SelectNextTab"} in bindings
          assert {"key": "[", "mods": "Alt", "action": "SelectPreviousTab"} in bindings
          assert frappe["colors"]["primary"]["background"] == "#303446"
          assert frappe["colors"]["primary"]["foreground"] == "#c6d0f5"
          assert frappe["colors"]["normal"]["blue"] == "#8caaee"
          assert (alacritty / "LICENSE").is_file()

          fontconfig = ET.parse("config/fontconfig/conf.d/75-noto-color-emoji.conf").getroot()
          fallback_test = fontconfig.find("./match/test")
          fallback_edit = fontconfig.find("./match/edit")
          assert fallback_test is not None and fallback_test.findtext("string") == "JetBrainsMono Nerd Font"
          assert fallback_edit is not None and fallback_edit.attrib["mode"] == "append"
          assert fallback_edit.findtext("string") == "Noto Color Emoji"
          print("Yazi, Alacritty TOML, Fontconfig XML, and Catppuccin Frappé configuration are valid.")
          PY

      - name: Help and non-destructive dry run
        run: |
          ./bin/dots --help
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" XDG_DATA_HOME="$test_home/.local/share" DOTS_SKIP_DOWNLOADS=1 ./bin/dots install --dry-run --no-packages --yes
          test ! -e "$test_home/.zshenv"
          test ! -e "$test_home/.config"

      - name: End-to-end lifecycle tests
        run: bash tests/test-dots.sh
